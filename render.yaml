# Render Blueprint: how Render builds and runs PactPal. See docs/decisions.md (Hosting).
# Secrets are marked sync: false, so Render asks for them in its dashboard; no values live here.
services:
  - type: web
    name: pactpal-server
    runtime: node
    # Starter: always on (0.5 CPU, 512 MB), so PayPal notifications never wait for a cold start.
    plan: starter
    region: virginia
    branch: dev
    autoDeployTrigger: commit
    # The server also serves the built web pages from its own address (docs/decisions.md).
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pactpal/web build && pnpm --filter @pactpal/server build
    startCommand: node apps/server/dist/index.js
    # Applies database changes before each deploy; if it fails, the deploy stops and the running version stays.
    preDeployCommand: node apps/server/dist/migrate.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The site's own address, from which PayPal's return address is built. Not a secret.
      - key: PUBLIC_BASE_URL
        value: https://pactpal-server.onrender.com
      # Proxies in front of the server, so visitors' IP addresses can be recorded. Measured on 1 Nov 2026:
      # Cloudflare, then Render's front server, which adds the visitor's address to X-Forwarded-For.
      # Re-measure if Render's setup changes (docs/decisions.md). Not a secret.
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: pactpal-db
          property: connectionString
      - key: PAYPAL_SELLER_CLIENT_ID
        sync: false
      - key: PAYPAL_SELLER_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # AI model hosts. Not used by the running server until the scope drafting step; set them now so
      # they are in place. Each model takes part only when its key is set.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Email through Resend: a key with sending access only, for the verified sending domain. The
      # sender address (EMAIL_FROM) is added here once that domain is verified; until both are set,
      # the server sends no email.
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: pactpal-db
    # Same region as the server (it cannot be changed later), so database traffic stays on Render's private network.
    region: virginia
    # Smallest paid plan (0.1 CPU, 256 MB); it can be upgraded later, and storage can only grow.
    plan: 0.1c-256mb
    diskSizeGB: 1
    # Cannot be changed after creation; matches the Postgres used in CI.
    postgresMajorVersion: "16"
    # No outside connections: only services on Render's private network can reach it.
    ipAllowList: []
