# Render Blueprint: how Render builds and runs PactPal. See docs/decisions.md (Hosting).
# Secrets are marked sync: false, so Render asks for them in its dashboard; no values live here.
services:
  - type: web
    name: pactpal-server
    runtime: node
    # Starter: always on (0.5 CPU, 512 MB), so PayPal notifications never wait for a cold start.
    plan: starter
    region: virginia
    branch: dev
    autoDeployTrigger: commit
    # The server also serves the built web pages from its own address (docs/decisions.md).
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pactpal/web build && pnpm --filter @pactpal/server build
    startCommand: node apps/server/dist/index.js
    # Applies database changes before each deploy; if it fails, the deploy stops and the running version stays.
    preDeployCommand: node apps/server/dist/migrate.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The site's own address, from which PayPal's return address is built. Not a secret.
      - key: PUBLIC_BASE_URL
        value: https://pactpal-server.onrender.com
      # Proxies in front of the server, so visitors' IP addresses can be recorded. Measured on 1 Nov 2026:
      # Cloudflare, then Render's front server, which adds the visitor's address to X-Forwarded-For.
      # Re-measure if Render's setup changes (docs/decisions.md). Not a secret.
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: pactpal-db
          property: connectionString
      - key: PAYPAL_SELLER_CLIENT_ID
        sync: false
      - key: PAYPAL_SELLER_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # AI model hosts. Not used by the running server until the scope drafting step; set them now so
      # they are in place. Each model takes part only when its key is set.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Email through Resend: a key with sending access only, for the sending domain
      # updates.pact-pal.app (verified 2 Nov 2026; click and open tracking off). The sender address
      # is not secret; "PactPal" is added as its name. Without both, the server sends no email.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: receipts@updates.pact-pal.app
      # Email forwarding through Resend Inbound on in.pact-pal.app: the webhook's signing secret and
      # a key that can read received emails. Without all three, forwarding stays off.
      - key: RESEND_INBOUND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: INBOUND_DOMAIN
        value: in.pact-pal.app
      # Dispute checks (5a): "Check now" starts a run of the Workflow task below. A Render API key
      # (it can act on the whole Render account, so it is a secret) and the task's name.
      - key: RENDER_API_KEY
        sync: false
      - key: DISPUTE_TASK_SLUG
        value: pactpal-workflows/check-disputes
      # Sellers' own PayPal apps (6h): the key that encrypts their app secrets in the database.
      # 32 random bytes in base64; the same value on pactpal-workflows. Losing it means every
      # seller must link again.
      - key: SELLER_KEYS_ENCRYPTION_KEY
        sync: false

  # Render Workflows: PactPal's background tasks, run on Render outside the website: check-disputes,
  # which reads the seller's PayPal disputes and logs them on their deals, and analyze-claim, which
  # runs the council comparing a dispute claim with the record (5d). Workflows
  # set their compute per task in code, so there is no plan here, and no pre-deploy step: the task
  # waits for the website's deploy to run the migrations.
  - type: workflow
    name: pactpal-workflows
    runtime: node
    region: virginia
    branch: dev
    autoDeployTrigger: commit
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pactpal/server build
    startCommand: node apps/server/dist/workflow.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: pactpal-db
          property: connectionString
      - key: PAYPAL_SELLER_CLIENT_ID
        sync: false
      - key: PAYPAL_SELLER_CLIENT_SECRET
        sync: false
      # AI model hosts for the claim comparison council (5d, analyze-claim). Each model takes part
      # only when its key is set; same values as on pactpal-server.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # The seller's dispute emails and deadline reminders (5j), sent after each check; same values
      # as on pactpal-server. Without them the checks run and send no email.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Sellers' own PayPal apps (6h): the dispute checks act through them; same value as on
      # pactpal-server.
      - key: SELLER_KEYS_ENCRYPTION_KEY
        sync: false

  # Render Workflows has no schedule of its own, so this Cron Job starts check-disputes every
  # 5 minutes and exits (a few seconds a run). PayPal sends no dispute notifications to the app.
  - type: cron
    name: pactpal-dispute-check
    runtime: node
    region: virginia
    plan: starter
    schedule: "*/5 * * * *"
    branch: dev
    autoDeployTrigger: commit
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pactpal/server build
    startCommand: node apps/server/dist/dispute-cron.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RENDER_API_KEY
        sync: false
      - key: DISPUTE_TASK_SLUG
        value: pactpal-workflows/check-disputes

databases:
  - name: pactpal-db
    # Same region as the server (it cannot be changed later), so database traffic stays on Render's private network.
    region: virginia
    # Smallest paid plan (0.1 CPU, 256 MB); it can be upgraded later, and storage can only grow.
    plan: 0.1c-256mb
    diskSizeGB: 1
    # Cannot be changed after creation; matches the Postgres used in CI.
    postgresMajorVersion: "16"
    # No outside connections: only services on Render's private network can reach it.
    ipAllowList: []
