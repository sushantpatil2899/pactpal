# Render Blueprint: how Render builds and runs PactPal. See docs/decisions.md (Hosting).
# Secrets are marked sync: false, so Render asks for them in its dashboard; no values live here.
services:
  - type: web
    name: pactpal-server
    runtime: node
    # Starter: always on (0.5 CPU, 512 MB), so PayPal notifications never wait for a cold start.
    plan: starter
    # Two copies behind Render's load balancer (9R-5): chat between copies goes through Postgres and
    # the agent call limit through Key Value, so either copy can answer any request.
    numInstances: 2
    region: virginia
    branch: dev
    autoDeployTrigger: commit
    # The server also serves the built web pages from its own address (docs/decisions.md).
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pactpal/web build && pnpm --filter @pactpal/server build
    startCommand: node apps/server/dist/index.js
    # Applies database changes before each deploy; if it fails, the deploy stops and the running version stays.
    preDeployCommand: node apps/server/dist/migrate.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Proxies in front of the server, so visitors' IP addresses can be recorded. Measured on 1 Nov 2026:
      # Cloudflare, then Render's front server, which adds the visitor's address to X-Forwarded-For.
      # Re-measure if Render's setup changes (docs/decisions.md). Not a secret.
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: pactpal-db
          property: connectionString
      # Keys this service shares with Workflows and the Cron Job (9R-3) come from the Environment
      # Group pactpal-shared, made in Render's dashboard (secrets cannot be written here):
      # PAYPAL_SELLER_CLIENT_ID and _SECRET, the four AI keys, RESEND_API_KEY, EMAIL_FROM,
      # PUBLIC_BASE_URL, SELLER_KEYS_ENCRYPTION_KEY and RENDER_API_KEY. A value set on the service
      # itself wins over the group's.
      - fromGroup: pactpal-shared
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Email forwarding through Resend Inbound on in.pact-pal.app: the webhook's signing secret and
      # a key that can read received emails. Without all three, forwarding stays off.
      - key: RESEND_INBOUND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: INBOUND_DOMAIN
        value: in.pact-pal.app
      # Dispute checks (5a): "Check now" starts a run of the Workflow task below (the Render API key
      # comes from the group).
      - key: DISPUTE_TASK_SLUG
        value: pactpal-workflows/check-disputes
      # Product listings (8e): Channel3's API key. Without it, "Look up" says it is not set up.
      - key: CHANNEL3_API_KEY
        sync: false
      # The store shared by both copies (9R-2): agent call counts and cached listings.
      - key: KEY_VALUE_URL
        fromService:
          type: keyvalue
          name: pactpal-kv
          property: connectionString

  # Render Key Value (Redis-compatible, 9R-2): counters and short-lived values shared by both copies
  # of the website. Nothing in it is evidence; losing it only resets limits and cached listings.
  - type: keyvalue
    name: pactpal-kv
    region: virginia
    plan: free
    # Oldest keys make room first when it is full.
    maxmemoryPolicy: allkeys-lru
    # No outside connections: only services on Render's private network can reach it.
    ipAllowList: []

  # The help site (9R-4, reworked in 7R): PactPal help for sellers plus the technical documents
  # that apply, in the website's look, rebuilt on every push and served from Render's global
  # network. Free. Working documents (plans, decisions, notes) are not published.
  - type: web
    name: pactpal-docs
    runtime: static
    branch: dev
    autoDeployTrigger: commit
    # Static sites build on a read-only image whose own pnpm cannot be replaced (corepack enable
    # fails there), so the repository's pnpm version runs through npx; Node 22 as everywhere else.
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx --yes pnpm@10.28.0 --filter @pactpal/docs build
    staticPublishPath: apps/docs/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # Render Workflows: PactPal's background tasks, run on Render outside the website: check-disputes,
  # which reads the seller's PayPal disputes and logs them on their deals; the dispute council jobs
  # (5d-5i); draft-scope (9R-1); retention-sweep (9c); and ask-model, one model call of any
  # council, so a council shows as a tree of runs, its models side by side. Workflows
  # set their compute per task in code, so there is no plan here, and no pre-deploy step: the task
  # waits for the website's deploy to run the migrations.
  - type: workflow
    name: pactpal-workflows
    runtime: node
    region: virginia
    branch: dev
    autoDeployTrigger: commit
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pactpal/server build
    startCommand: node apps/server/dist/workflow.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: pactpal-db
          property: connectionString
      # PayPal, the AI keys, email and the seller-app key, shared with the website (9R-3).
      - fromGroup: pactpal-shared

  # Render Workflows has no schedule of its own, so this Cron Job starts check-disputes every
  # 5 minutes and exits (a few seconds a run). PayPal sends no dispute notifications to the app.
  - type: cron
    name: pactpal-dispute-check
    runtime: node
    region: virginia
    plan: starter
    schedule: "*/5 * * * *"
    branch: dev
    autoDeployTrigger: commit
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pactpal/server build
    startCommand: node apps/server/dist/dispute-cron.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The Render API key, shared with the website (9R-3).
      - fromGroup: pactpal-shared
      - key: DISPUTE_TASK_SLUG
        value: pactpal-workflows/check-disputes

  # The retention clean-up (9c, docs/privacy.md): once a day this Cron Job starts the
  # retention-sweep Workflow task, which removes deals 210 days after their last activity and raw
  # notifications and AI drafts after 60 days, then exits.
  - type: cron
    name: pactpal-retention
    runtime: node
    region: virginia
    plan: starter
    schedule: "17 3 * * *"
    branch: dev
    autoDeployTrigger: commit
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pactpal/server build
    startCommand: node apps/server/dist/retention-cron.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The Render API key, shared with the website (9R-3).
      - fromGroup: pactpal-shared
      - key: RETENTION_TASK_SLUG
        value: pactpal-workflows/retention-sweep

databases:
  - name: pactpal-db
    # Same region as the server (it cannot be changed later), so database traffic stays on Render's private network.
    region: virginia
    # Smallest paid plan (0.1 CPU, 256 MB); it can be upgraded later, and storage can only grow.
    plan: 0.1c-256mb
    diskSizeGB: 1
    # Cannot be changed after creation; matches the Postgres used in CI.
    postgresMajorVersion: "16"
    # No outside connections: only services on Render's private network can reach it.
    ipAllowList: []
